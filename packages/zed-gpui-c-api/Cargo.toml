[package]
name = "zed-gpui-c-api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lib]
name = "zed_gpui_c_api"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[features]
# Compile Metal shaders at runtime, which needs no Metal Toolchain at build time.
runtime_shaders = ["gpui_macos/runtime_shaders", "gpui_ios/runtime_shaders"]

[dependencies]
anyhow.workspace = true
assets.workspace = true
futures.workspace = true
gpui.workspace = true
grammars = { workspace = true, features = ["load-grammars"] }
language.workspace = true
log.workspace = true
markdown.workspace = true
release_channel.workspace = true
reqwest_client.workspace = true
semver.workspace = true
settings.workspace = true
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
urlencoding.workspace = true
# Dev builds of Zed read assets from the Zed checkout at runtime; embed them instead.
util = { workspace = true, features = ["debug-embed"] }
zlog.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true, features = ["font-kit"] }

[target.'cfg(target_os = "ios")'.dependencies]
gpui_ios.workspace = true
